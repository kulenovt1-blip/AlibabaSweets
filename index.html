<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ver" content="37.1">
<meta name="theme-color" content="#F3F3EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://script.google.com" crossorigin><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* Тема и размер текста — до отрисовки, чтобы экран не мигал. Хранятся только на этом устройстве (ключ ui). По умолчанию светлая тема и обычный текст */
(function () { try {
  var u = JSON.parse(localStorage.getItem('ui') || '{}') || {}, r = document.documentElement;
  var dark = u.th == 'dark' || (u.th == 'sys' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', dark ? 'dark' : 'light'); r.setAttribute('data-fs', String(u.fs == 1 || u.fs == 2 ? u.fs : 0));
  var tc = document.querySelector('meta[name=theme-color]'); if (tc) tc.setAttribute('content', dark ? '#0E100E' : '#F3F3EE');
} catch (e) {} })();
</script>
<script>
/* Показывает любую ошибку скрипта красной плашкой вверху страницы (чтобы не гадать, почему пусто) */
window.addEventListener('error', function (e) {
  if (e.target && e.target !== window && e.target.tagName != 'SCRIPT') return;
  var m = e.target && e.target.tagName == 'SCRIPT' ? 'не загрузился файл ' + e.target.src : e.message + ' [' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ']';
  var d = document.createElement('div'); d.style.cssText = 'background:#C82B27;color:#fff;padding:12px;font:700 14px sans-serif;position:relative;z-index:99';
  d.textContent = 'Ошибка: ' + m; (document.body || document.documentElement).prepend(d);
  var s = document.getElementById('splash'); if (s) s.hidden = true;   // ошибка важнее загрузочного экрана
}, true);
</script>
<title>Али-Баба · Заявка</title></head>
<body>
<!-- ЗАГРУЗОЧНЫЙ ЭКРАН (v33): тот же тёмный цвет, что у заставки Android (manifest), логотип там же, где значок. Убирает app.js -->
<div id="splash" role="status" aria-label="Загрузка">
  <div class="spr"><svg viewBox="0 0 176 176" width="176" height="176" aria-hidden="true"><circle class="tr0" cx="88" cy="88" r="84"/><circle class="tr1" cx="88" cy="88" r="84"/></svg><div class="spl"><img src="logo.jpg" alt="Али-Баба"></div></div>
  <div class="spw"><b>Али-Баба</b><span>ПРИЁМ ЗАЯВОК</span></div>
  <div class="sps"><div id="sp1" class="on">Прайс<em></em></div><div id="sp2">Магазины и маршрут<em></em></div><div id="sp3">Заявки за 30 дней<em></em></div></div>
  <div class="spv" id="spv"></div>
  <div class="spo" id="spo" hidden><b id="spot">Нет интернета</b><p id="spom"></p><button data-a="splr">Повторить</button></div>
</div>
<script>setTimeout(function () { var s = document.getElementById('splash'); if (s && !window.__splOwn) s.hidden = true }, 6000)   /* запасной путь: app.js не загрузился — экран не должен висеть */</script>

<!-- СТРОКА СОСТОЯНИЯ (v33: логотип и название с рабочих экранов убраны; разделы — в нижней панели) -->
<header class="top"><div class="toph"><h1 class="ttl">Заявка</h1><div class="seg sm" id="seg" aria-label="Режим цен"></div></div><p id="sy">Приём заявок</p></header>

<!-- ДАННЫЕ О КЛИЕНТЕ -->
<!-- v33: магазин выбран — карточка «Магазин · адрес · поставка» и «Сменить»; иначе (или после «Сменить») — поля -->
<section class="card hdrform" id="hf">
  <div id="ocs" class="ocs full" hidden></div>
  <b class="hft full">Магазин и дата поставки</b>
  <label class="hdv"><span id="dv" class="hdvt"></span><input type="date" id="d" aria-label="Дата поставки"></label><select id="c" aria-label="Город"></select>
  <div class="cb"><input id="s" maxlength="120" autocomplete="off" placeholder="Магазин: выберите или впишите"><div id="sl" class="dd" hidden></div></div>
  <input class="full" id="a" maxlength="300" list="stl" autocomplete="off" placeholder="Адрес"><datalist id="stl"></datalist>
  <button class="send full hfok" id="hfok" data-a="hfok" hidden>Готово</button>
  <button class="ghost full hfun" id="hfun" data-a="hfund" hidden>Отменить</button>
  <select class="full" id="rch" hidden aria-label="Кому отправить заявку"></select>
  <div id="sw" class="sw full" hidden></div>
</section>

<!-- ПОИСК, ВИД КАТАЛОГА (плитка / список) И КАТЕГОРИИ -->
<div class="tools"><div class="srow"><div class="sf"><span class="si"></span><input id="q" type="search" placeholder="Поиск" aria-label="Поиск товара"></div><button id="cvb" class="cvb" data-a="cv"></button><button id="clr" data-a="clr" hidden aria-label="Сбросить корзину"></button></div><nav class="chips" id="chips"></nav></div>

<!-- КАТАЛОГ -->
<main id="list" class="grid"></main>

<!-- ПОЛОСА ЗАЯВКИ (v33): «N позиций · сумма» и «Оформить» -->
<button id="bar" class="off" data-a="cart"><span id="bn"></span><span id="bs"></span></button>

<!-- СТРАНИЦА РАЗДЕЛА (маршрут, магазин, корзина, история, «Ещё»): поверх каталога, с кнопкой «Назад» -->
<div id="bd" data-a="x"></div>
<section id="sheet"><div class="shd"><button id="sbk" class="bk" data-a="back" hidden></button><h2 id="st"></h2></div><div id="sb"></div></section>

<!-- НИЖНЯЯ ПАНЕЛЬ РАЗДЕЛОВ -->
<nav class="bn" id="bnav" aria-label="Разделы">
  <button data-a="nroute" data-t="route"><span class="ic" id="ic-route"></span><span class="lb">Маршрут</span></button>
  <button data-a="nmain" data-t="main"><span class="ic" id="ic-main"></span><span class="lb">Заявка</span></button>
  <button data-a="hopen" data-t="hist"><span class="ic" id="ic-hist"></span><span class="lb">История</span></button>
  <button data-a="nmore" data-t="more"><span class="ic" id="drbi"></span><span class="lb">Профиль</span></button>
</nav>

<!-- ОКНО ВОПРОСА / СООБЩЕНИЯ (вместо системных alert и confirm) -->
<div id="dlg" hidden></div>

<!-- ЗУМ ФОТО -->
<div id="lb" data-a="lbx"><img alt=""></div>

<script src="app.js"></script>
</body></html>
